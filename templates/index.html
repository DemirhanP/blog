{% extends "base.html" %}

{% block title %}Home{% endblock %}

{% block content %}
<h1>Blogs</h1>
<ul>
  {% for p in posts %}
    <li>
      <a href="{{ url_for('show_post', post_id=p.id) }}">{{ p.title }}</a>
      by {{ p.username }}, {{ p.created_at.strftime('%Y-%m-%d') }}
    </li>
  {% else %}
    <li>No posts yet.</li>
  {% endfor %}
</ul>
{% endblock %}
