{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<h1>Register</h1>

{% if error %}
  <p>{{ error }}</p>
{% endif %}

<form method="post">
  <p><label>Username <input name="username"></label></p>
  <p><label>Password <input name="password" type="password"></label></p>
  <button>Register</button>
</form>
{% endblock %}
